<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img">
  <title>BitPlay layers</title>
  <desc>The CLI prints an Analysis. The use case asks a BoxSource for top-level boxes, then the domain builds the layout. The file walker never reads mdat media.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3d6b7a"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#f4f1ea"/>
  <text x="40" y="42" fill="#1c1915" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="650">Layers</text>
  <text x="40" y="66" fill="#6b645c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">The layout model is pure data. Only the walker opens the file.</text>

  <rect x="40" y="92" width="880" height="88" rx="12" fill="#fffcf7" stroke="#d9d3c7"/>
  <text x="60" y="122" fill="#3d6b7a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650">PRESENTATION</text>
  <text x="60" y="150" fill="#1c1915" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">BitPlay CLI</text>
  <text x="200" y="150" fill="#6b645c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Prints metadata and the I / P / B / audio summary</text>

  <line x1="480" y1="180" x2="480" y2="208" stroke="#3d6b7a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="208" width="880" height="88" rx="12" fill="#fffcf7" stroke="#d9d3c7"/>
  <text x="60" y="238" fill="#3d6b7a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650">APPLICATION</text>
  <text x="60" y="266" fill="#1c1915" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">analyze</text>
  <text x="140" y="266" fill="#6b645c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Asks a BoxSource for top-level boxes, then calls domain::build</text>

  <line x1="280" y1="296" x2="280" y2="324" stroke="#3d6b7a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="296" x2="700" y2="324" stroke="#3d6b7a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="324" width="430" height="120" rx="12" fill="#fffcf7" stroke="#d9d3c7"/>
  <text x="60" y="354" fill="#3d6b7a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650">DOMAIN</text>
  <text x="60" y="384" fill="#1c1915" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">Layout model</text>
  <text x="60" y="408" fill="#6b645c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Sample tables, GOP marks, spans.</text>
  <text x="60" y="426" fill="#6b645c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">No filesystem.</text>

  <rect x="490" y="324" width="430" height="120" rx="12" fill="#fffcf7" stroke="#d9d3c7"/>
  <text x="510" y="354" fill="#3d6b7a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650">INFRASTRUCTURE</text>
  <text x="510" y="384" fill="#1c1915" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">File box walk</text>
  <text x="510" y="408" fill="#6b645c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Reads moov and moof payloads.</text>
  <text x="510" y="426" fill="#6b645c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Leaves mdat media on disk.</text>
</svg>
