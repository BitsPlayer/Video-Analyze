<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img">
  <title>What BitPlay reads</title>
  <desc>Box headers are read for every top-level box. moov and moof payloads are read. mdat media bytes are not. Sample spans are placed from the tables inside moov.</desc>
  <defs>
    <marker id="link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3d6b7a"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#f4f1ea"/>
  <text x="40" y="42" fill="#1c1915" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="650">What gets read</text>
  <text x="40" y="66" fill="#6b645c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">A truncated file still yields every box header that fits. Sample spans need moov.</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="40" y="100" width="880" height="64" rx="10" fill="#fffcf7" stroke="#d9d3c7"/>
    <text x="60" y="138" fill="#1c1915" font-size="15" font-weight="650">MP4 file</text>
    <text x="180" y="138" fill="#6b645c" font-size="13">ftyp, moov, free, mdat, and anything else at the top level</text>
  </g>

  <line x1="200" y1="164" x2="160" y2="204" stroke="#3d6b7a" stroke-width="1.5" marker-end="url(#link)"/>
  <line x1="480" y1="164" x2="480" y2="204" stroke="#3d6b7a" stroke-width="1.5" marker-end="url(#link)"/>
  <line x1="760" y1="164" x2="800" y2="204" stroke="#8a5a12" stroke-width="1.5" marker-end="url(#link)"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="40" y="204" width="250" height="100" rx="10" fill="#eef3f4" stroke="#c5d4d8"/>
    <text x="56" y="236" fill="#1c1915" font-size="15" font-weight="650">Every header</text>
    <text x="56" y="260" fill="#6b645c" font-size="13">Offset, size, fourcc.</text>
    <text x="56" y="280" fill="#6b645c" font-size="13">Enough for ftyp, free, mdat.</text>

    <rect x="330" y="204" width="300" height="100" rx="10" fill="#eef3f4" stroke="#c5d4d8"/>
    <text x="346" y="236" fill="#1c1915" font-size="15" font-weight="650">moov and moof payloads</text>
    <text x="346" y="260" fill="#6b645c" font-size="13">mvhd, tracks, sample tables,</text>
    <text x="346" y="280" fill="#6b645c" font-size="13">sync samples, and offsets.</text>

    <rect x="670" y="204" width="250" height="100" rx="10" fill="#f8f1e3" stroke="#e4d3b0"/>
    <text x="686" y="236" fill="#1c1915" font-size="15" font-weight="650">mdat media</text>
    <text x="686" y="260" fill="#6b645c" font-size="13">Left on disk. The header</text>
    <text x="686" y="280" fill="#6b645c" font-size="13">is recorded. The payload is not.</text>
  </g>

  <line x1="480" y1="304" x2="480" y2="344" stroke="#3d6b7a" stroke-width="1.5" marker-end="url(#link)"/>
  <text x="492" y="330" fill="#6b645c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">sample tables</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="40" y="344" width="880" height="88" rx="10" fill="#fffcf7" stroke="#d9d3c7"/>
    <text x="60" y="376" fill="#1c1915" font-size="15" font-weight="650">Layout spans</text>
    <text x="60" y="404" fill="#6b645c" font-size="13">ftyp, moov, free, mdat header, then one span per sample: I-frame, P-frame, B-frame, or audio.</text>
    <text x="60" y="424" fill="#6b645c" font-size="13">Each video span carries its GOP index. Without moov, the span list stops at the box map.</text>
  </g>
</svg>
